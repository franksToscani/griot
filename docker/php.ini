; Griot in production (Dockerfile), on top of php.ini-production.

; Uploads: PHP accepts up to 3 MB, on purpose MORE than the validation of the photos (2 MB,
; StoreProviderPhotoRequest; 1.5 MB, StoreProviderAvatarRequest): a file between the two gets the
; clear message of the form. One photo per request; 8 MB leaves room for the other fields.
upload_max_filesize = 3M
post_max_size = 8M

; A photo of 4000x4000 decoded by GD takes about 64 MB, plus its resized copies (WebpEncoder).
memory_limit = 256M

; The code never changes inside the image: no check of the files' timestamps.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128

expose_php = Off
