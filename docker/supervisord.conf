; The three processes of the container (Dockerfile): the web server, the queue worker and the
; scheduler. Not root; every log goes to the container's output, which Render collects.
; supervisord: declarative, a Debian package, and it runs as a normal user without any trick
; (s6-overlay is lighter but more delicate without root).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

; The web server is never restarted here: when it stops, griot-stop-on-web-exit stops
; supervisord, the container exits and Render starts a new one (the health check on /up too).
[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=/app
priority=10
autorestart=false
startsecs=3
startretries=0
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The notifications have their own tries and backoff. --max-time and --memory end the worker
; now and then on purpose: supervisord starts it again.
[program:queue]
command=php /app/artisan queue:work --sleep=3 --max-time=3600 --memory=128
directory=/app
priority=20
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
priority=30
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:stop-on-web-exit]
command=griot-stop-on-web-exit
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
